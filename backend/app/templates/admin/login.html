<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Admin — Ngrembaka Aksara</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body { font-family:'Poppins',sans-serif; background:#E8F5E9; }
    .card-login { border:none; border-radius:12px; box-shadow:0 4px 20px rgba(27,94,32,0.12); }
    .btn-login { background:#1B5E20; color:#fff; border:none; border-radius:8px; }
    .btn-login:hover { background:#66BB6A; color:#fff; }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh;">
  <div class="col-11 col-sm-8 col-md-5 col-lg-4">
    <div class="text-center mb-4">
      <span style="font-size:2.5rem;">📚</span>
      <h5 class="fw-bold mt-2" style="color:#1B5E20;">Admin Ngrembaka Aksara</h5>
    </div>
    <div class="card card-login p-4">
      {% if error %}
      <div class="alert alert-danger small">{{ error }}</div>
      {% endif %}
      <form method="post" action="/admin/login">
        <div class="mb-3">
          <label class="form-label fw-semibold">Username</label>
          <input type="text" name="username" class="form-control" required autofocus />
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Password</label>
          <input type="password" name="password" class="form-control" required />
        </div>
        <button type="submit" class="btn btn-login w-100 fw-semibold">Masuk</button>
      </form>
    </div>
  </div>
</body>
</html>
