<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan 2</title>
    <style>
        /* CSS bisa ditulis di sini */
        /* tulis satu persatu untuk latihan dan lihat hasilnya di browser */
        /* body artinya seluruh halaman, bukan hanya satu elemen */
        body {
            font-family: Arial, sans-serif;
        }

        /* box: untuk memberi background, border, padding, margin */
        .box {
            background: #d7f0d3;
            border: 1px solid #2d6a4f;
            padding: 8px;
            margin: 4px;
        }

        /* block: selalu turun baris */
        .block {
            display: block;
            width: 180px;
        }

        /* inline: tetap sebaris, width/height diabaikan */
        .inline {
            display: inline;
            width: 180px;
            height: 50px;
        }

        /* inline-block: sebaris tapi width/height bekerja */
        .inline-block {
            display: inline-block;
            width: 180px;
            height: 50px;
        }

        /* flex : artinya elemen diatur dalam baris/kolom secara fleksibel */
        .flex-wrap-demo {
            display: flex;
            gap: 10px;
            background: #f3f6f4;
            padding: 10px;
        }

        /* item: untuk memberi background, padding, border-radius */
        .item {
            background: #95d5b2;
            padding: 12px 16px;
            border-radius: 6px;
        }

        /* grid: untuk layout kompleks dengan baris dan kolom */
        .grid-demo {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            background: #f3f6f4;
            padding: 10px;
        }

        /* none: elemen hilang dari layout */
        .hilang {
            display: none;
        }

        /* contents: wrapper seolah tidak ada */
        .wrapper-contents {
            display: contents;
        }

        /* tag: untuk memberi background, border, padding, border-radius */
        .tag {
            display: inline-block;
            background: #cfe8ff;
            border: 1px solid #3b82f6;
            padding: 6px 10px;
            border-radius: 999px;
            margin-right: 6px;
        }
    </style>
</head>

<body>
    <h3>1) block vs inline vs inline-block</h3>

    <div class="box block">Block A</div>
    <div class="box block">Block B</div>

    <span class="box inline">Inline A</span>
    <span class="box inline">Inline B</span>

    <span class="box inline-block">Inline-Block A</span>
    <span class="box inline-block">Inline-Block B</span>

    <hr>

    <h3>2) flex</h3>
    <div class="flex-wrap-demo">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
    </div>

    <hr>

    <h3>3) grid</h3>
    <div class="grid-demo">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
    </div>

    <hr>

    <h3>4) none</h3>
    <p class="hilang">Teks ini disembunyikan dengan display: none;</p>
    <p>Teks ini tetap tampil.</p>

    <hr>

    <h3>5) contents</h3>
    <div class="wrapper-contents">
        <span class="tag">Tag 1</span>
        <span class="tag">Tag 2</span>
    </div>
</body>

</html>
