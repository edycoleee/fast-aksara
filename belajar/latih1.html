<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dasar: Susunan Baris</title>
    <style>
        .container {
            display: flex;
            /* aktifkan flexbox */
            flex-direction: row;
            /* susunan ke samping */
            gap: 10px;
            /* jarak antar elemen */
        }

        .box {
            background: lightblue;
            padding: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">A</div>
        <div class="box">B</div>
        <div class="box">C</div>
    </div>
</body>

</html>
